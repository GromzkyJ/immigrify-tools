name: Deploy to Production

on:
  push:
    branches:
      - test
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Setup PHP and Composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, xml, zip, gd, curl, mysqli, pdo_mysql
        tools: composer
    
    - name: Install Composer Dependencies for SuiteCRM
      run: |
        if [ -f "crm/composer.json" ]; then
          echo "Installing Composer dependencies for SuiteCRM..."
          cd crm
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          cd ..
        fi
    
    - name: Build React Apps
      run: |
        # Find all directories with package.json (React apps)
        for dir in */; do
          if [ -f "${dir}package.json" ]; then
            dirname=$(basename "$dir")
            echo "Building React app: ${dirname}"
            cd "${dir}"
            
            echo "  Installing dependencies..."
            if ! npm install; then
              echo "  ✗ ERROR: npm install failed for ${dirname}"
              exit 1
            fi
            
            echo "  Building app..."
            if ! npm run build; then
              echo "  ✗ ERROR: npm run build failed for ${dirname}"
              exit 1
            fi
            
            # Verify build directory was created
            if [ ! -d "build" ]; then
              echo "  ✗ ERROR: build directory not created for ${dirname}"
              exit 1
            fi
            
            # Verify build has files
            if [ -z "$(ls -A build 2>/dev/null)" ]; then
              echo "  ✗ ERROR: build directory is empty for ${dirname}"
              exit 1
            fi
            
            echo "  ✓ Successfully built ${dirname}"
            echo "  Build contains $(find build -type f | wc -l) files"
            cd ..
          fi
        done
    
    - name: Prepare build directory
      run: |
        mkdir -p build
        
        echo "Available directories:"
        ls -la
        
        # Copy simple HTML apps (folders without package.json)
        echo "=== Starting to copy directories ==="
        for dir in */; do
          dirname=$(basename "$dir")
          echo "Checking directory: ${dirname}"
          
          # Skip if it's a React app (has package.json) or special folders
          if [ -f "${dir}package.json" ]; then
            echo "  → Skipping ${dirname} (has package.json - React app)"
            continue
          fi
          
          if [ "$dirname" == "node_modules" ] || [ "$dirname" == ".git" ] || [ "$dirname" == "build" ] || [ "$dirname" == ".github" ] || [ "$dirname" == "docs" ] || [ "$dirname" == "examples" ]; then
            echo "  → Skipping ${dirname} (special folder)"
            continue
          fi
          
          echo "  → Copying ${dirname} to build/"
          if cp -r "${dir}" build/; then
            echo "  ✓ Successfully copied ${dirname}"
            echo "  Verifying copy:"
            if [ -d "build/${dirname}" ]; then
              echo "    ✓ build/${dirname} exists"
              file_count=$(find "build/${dirname}" -type f 2>/dev/null | wc -l)
              echo "    ✓ Contains ${file_count} files"
            else
              echo "    ✗ ERROR: build/${dirname} does not exist after copy!"
            fi
          else
            echo "  ✗ ERROR: Failed to copy ${dirname}"
          fi
        done
        
        echo "Build directory contents after copying:"
        ls -la build/
        
        # Configure SuiteCRM .htaccess for subdirectory deployment
        if [ -d "build/crm" ] && [ -f "crm/.htaccess" ]; then
          echo "Configuring .htaccess for SuiteCRM subdirectory"
          # Update RewriteBase - will be set correctly in deployment step
          # Default to test, production step will override if needed
          cp crm/.htaccess build/crm/.htaccess
        fi
        
        # Copy React app build outputs - SIMPLIFIED APPROACH
        for dir in */; do
          dirname=$(basename "$dir")
          if [ -f "${dir}package.json" ] && [ -d "${dir}build" ]; then
            echo "Copying React app: ${dirname}"
            # Simple approach: copy entire build directory including hidden files
            mkdir -p "build/${dirname}"
            # Copy visible files
            cp -r "${dir}build"/* "build/${dirname}/" 2>/dev/null || true
            # Copy hidden files explicitly (important for .htaccess, .nojekyll, etc.)
            shopt -s dotglob
            for file in "${dir}build"/.*; do
              if [ -f "$file" ] && [ "$(basename "$file")" != "." ] && [ "$(basename "$file")" != ".." ]; then
                cp "$file" "build/${dirname}/" 2>/dev/null || true
              fi
            done
            shopt -u dotglob
            # Remove any symlinks (FTP can't handle them)
            find "build/${dirname}" -type l -delete 2>/dev/null || true
            # Verify essential files exist
            if [ -f "build/${dirname}/index.html" ]; then
              echo "  ✓ Copied ${dirname} build (index.html verified)"
            else
              echo "  ⚠ Warning: index.html not found after copy"
            fi
          fi
        done
        
        # Copy root level HTML/CSS/JS files
        cp -r *.html *.css *.js build/ 2>/dev/null || true
        cp -r public build/ 2>/dev/null || true
    
    - name: Configure .htaccess for Test Environment
      if: github.ref == 'refs/heads/test'
      run: |
        if [ -f "build/crm/.htaccess" ]; then
          echo "Setting RewriteBase for test environment"
          sed -i 's|RewriteBase /tools-test/crm/|RewriteBase /tools-test/crm/|g' build/crm/.htaccess
          sed -i 's|RewriteBase /tools/crm/|RewriteBase /tools-test/crm/|g' build/crm/.htaccess
        fi
    
    - name: Verify build directory
      if: github.ref == 'refs/heads/test'
      run: |
        echo "=== Build Directory Verification ==="
        echo "Checking if build directory exists..."
        if [ ! -d "build" ]; then
          echo "ERROR: Build directory does not exist!"
          exit 1
        fi
        
        echo "Build directory contents:"
        ls -la build/ || echo "Cannot list build directory"
        
        echo "All folders in build/:"
        find build/ -maxdepth 1 -type d | sort
        
        echo "Checking for React apps..."
        for dir in build/*/; do
          if [ -d "$dir" ]; then
            dirname=$(basename "$dir")
            echo "Checking ${dirname}..."
            if [ -f "build/${dirname}/index.html" ] || [ -f "build/${dirname}/static" ]; then
              echo "  ✓ ${dirname} appears to be a valid app (has index.html or static folder)"
              file_count=$(find "build/${dirname}" -type f 2>/dev/null | wc -l)
              echo "  ✓ Contains ${file_count} files"
            else
              echo "  ⚠ ${dirname} might be incomplete (no index.html or static folder)"
            fi
          fi
        done
        
        echo "Checking for CRM folder (if present)..."
        if [ -d "build/crm" ]; then
          echo "✓ CRM folder found in build/"
          echo "CRM folder contents (first 20 items):"
          ls -la build/crm/ | head -20
          echo "Total files in crm: $(find build/crm -type f 2>/dev/null | wc -l)"
        else
          echo "ℹ CRM folder not found (this is OK if not deploying CRM)"
        fi
        
        echo "=== Verification Complete ==="
    
    - name: Pre-FTP Verification
      if: github.ref == 'refs/heads/test'
      run: |
        echo "=== Pre-FTP Verification ==="
        echo "Checking build directory structure..."
        echo "Total items in build/:"
        find build/ -maxdepth 1 -type f -o -type d | wc -l
        
        echo "Listing all top-level items in build/:"
        ls -la build/
        
        echo "Checking for React apps in build/:"
        for app_dir in build/*/; do
          if [ -d "$app_dir" ]; then
            app_name=$(basename "$app_dir")
            echo "  App: ${app_name}"
            if [ -f "${app_dir}index.html" ]; then
              echo "    ✓ Has index.html"
            fi
            if [ -d "${app_dir}static" ]; then
              echo "    ✓ Has static folder"
            fi
            file_count=$(find "$app_dir" -type f 2>/dev/null | wc -l)
            echo "    Total files: ${file_count}"
          fi
        done
        
        echo "=== Pre-FTP Verification Complete ==="
        
        # Ensure build directory is not empty
        if [ -z "$(ls -A build/ 2>/dev/null)" ]; then
          echo "ERROR: Build directory is empty!"
          exit 1
        fi
        
        # List all files that will be uploaded (for debugging)
        echo "=== Files to be uploaded ==="
        find build/ -type f | head -50
        echo "Total files: $(find build/ -type f | wc -l)"
        
        # Final cleanup: remove any remaining symlinks
        echo "Removing any symlinks from build directory..."
        find build/ -type l -delete 2>/dev/null || true
        
        # Show final structure
        echo "Build directory structure:"
        ls -la build/ | head -10
        
        echo "Build directory is ready for deployment"
    
    - name: Pre-FTP File Verification
      if: github.ref == 'refs/heads/test'
      run: |
        echo "=== Pre-FTP File Verification ==="
        
        # Verify all files exist and are readable
        echo "Checking file accessibility..."
        failed_files=0
        for file in $(find build/ -type f); do
          if [ ! -r "$file" ]; then
            echo "✗ Cannot read: $file"
            failed_files=$((failed_files + 1))
          fi
        done
        
        if [ "$failed_files" -gt 0 ]; then
          echo "✗ Found $failed_files unreadable files"
          exit 1
        else
          echo "✓ All files are readable"
        fi
        
        # Check for empty directories (might confuse FTP)
        echo ""
        echo "Checking for empty directories..."
        empty_dirs=$(find build/ -type d -empty | wc -l)
        if [ "$empty_dirs" -gt 0 ]; then
          echo "⚠ Found $empty_dirs empty directories:"
          find build/ -type d -empty | head -10
        else
          echo "✓ No empty directories"
        fi
        
        # Verify no broken symlinks
        echo ""
        echo "Checking for broken symlinks..."
        broken_symlinks=$(find build/ -type l ! -exec test -e {} \; -print 2>/dev/null | wc -l)
        if [ "$broken_symlinks" -gt 0 ]; then
          echo "✗ Found $broken_symlinks broken symlinks:"
          find build/ -type l ! -exec test -e {} \; -print 2>/dev/null | head -10
          exit 1
        else
          echo "✓ No broken symlinks"
        fi
        
        # Check total size
        echo ""
        echo "Total build directory size:"
        du -sh build/
        
        echo "=== Verification Complete ==="
    
    - name: Comprehensive Build Directory Analysis
      if: github.ref == 'refs/heads/test'
      run: |
        echo "========================================="
        echo "COMPREHENSIVE BUILD DIRECTORY ANALYSIS"
        echo "========================================="
        
        echo ""
        echo "=== Directory Structure ==="
        find build/ -type d | head -30 || ls -R build/ | head -30
        
        echo ""
        echo "=== All Files Count ==="
        echo "Total files: $(find build/ -type f | wc -l)"
        echo "Total directories: $(find build/ -type d | wc -l)"
        
        echo ""
        echo "=== Contact-Form Specific Analysis ==="
        if [ -d "build/contact-form" ]; then
          echo "✓ contact-form directory exists"
          echo "  Files in contact-form: $(find build/contact-form -type f | wc -l)"
          echo "  Directories in contact-form: $(find build/contact-form -type d | wc -l)"
          echo ""
          echo "  Top-level contents:"
          ls -la build/contact-form/ | head -20
          echo ""
          echo "  All files in contact-form:"
          find build/contact-form -type f | head -30
          echo ""
          echo "  Static folder check:"
          if [ -d "build/contact-form/static" ]; then
            echo "    ✓ static folder exists ($(find build/contact-form/static -type f | wc -l) files)"
            echo "    Sample static files:"
            find build/contact-form/static -type f | head -10
          else
            echo "    ✗ static folder MISSING"
          fi
          echo ""
          echo "  Critical files check:"
          for file in index.html asset-manifest.json manifest.json robots.txt; do
            if [ -f "build/contact-form/$file" ]; then
              echo "    ✓ $file exists ($(wc -c < "build/contact-form/$file" 2>/dev/null || echo 0) bytes)"
            else
              echo "    ✗ $file MISSING"
            fi
          done
          echo ""
          echo "  Hidden files check:"
          find build/contact-form -name ".*" -type f | head -10
          echo ""
          echo "  Symlinks check:"
          symlinks=$(find build/contact-form -type l | wc -l)
          if [ "$symlinks" -gt 0 ]; then
            echo "    ⚠ Found $symlinks symlinks:"
            find build/contact-form -type l | head -10
          else
            echo "    ✓ No symlinks found"
          fi
        else
          echo "✗ contact-form directory NOT FOUND in build/"
        fi
        
        echo ""
        echo "=== Calculator Comparison (if exists) ==="
        if [ -d "build/calculator" ]; then
          echo "✓ calculator directory exists"
          echo "  Files: $(find build/calculator -type f | wc -l)"
          echo "  Structure comparison:"
          ls -la build/calculator/ | head -10
        fi
        
        echo ""
        echo "=== File Size Analysis ==="
        echo "Largest files in build/:"
        find build/ -type f -exec ls -lh {} \; 2>/dev/null | sort -k5 -hr | head -20 || true
        
        echo ""
        echo "=== Files with Special Characters ==="
        find build/ -type f -name "*[^a-zA-Z0-9._/-]*" | head -10 || echo "  (none found)"
        
        echo ""
        echo "=== Directory Permissions ==="
        find build/ -type d -exec ls -ld {} \; | head -20
        
        echo ""
        echo "=== Sample File Permissions ==="
        find build/ -type f -exec ls -l {} \; | head -20
        
        echo "========================================="
    
    - name: Deploy to Test Environment
      if: github.ref == 'refs/heads/test'
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./build/
        server-dir: ./tools-test/
        protocol: ftp
        port: 21
        dangerous-clean-slate: true
        log-level: verbose
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/.github/**
          **/.travis.yml
          **/.codecov.yml
          **/codacy.yml
          **/codeception.dist.yml
          **/phpcs.xml
          **/.php_cs.dist
          **/.php_cs.cache
          **/RoboFile.php
          **/crm/build/**
          **/vendor/build/**
          **/travis.php.ini
          **/README.md
          **/LICENSE.txt
          **/.env.dist
          **/.gitattributes
          **/composer.lock
          **/bower_components/**
          **/.sass-cache/**
          **/tests/_output/**
          **/tests/_envs/**
          **/codeception.yml
          **/BrowserStackLocal
          **/browserstack.err
          **/fakeImapResource
          **/include/Imap/ImapTestSettings.txt
          **/themes/SuiteP/css/*.map
          **/themes/SuiteP/css/*/*.map
          **/themes/SuiteP/css/*/color-palette.css
          **/themes/SuiteP/css/*/variables.css
    
    - name: Configure .htaccess for Production Environment
      if: github.ref == 'refs/heads/main'
      run: |
        if [ -f "build/crm/.htaccess" ]; then
          echo "Setting RewriteBase for production environment"
          sed -i 's|RewriteBase /tools-test/crm/|RewriteBase /tools/crm/|g' build/crm/.htaccess
          sed -i 's|RewriteBase /tools/crm/|RewriteBase /tools/crm/|g' build/crm/.htaccess
        fi
    
    - name: Verify build directory
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Checking build directory contents..."
        ls -la build/ || echo "Build directory does not exist"
        if [ -d "build/crm" ]; then
          echo "CRM folder found in build/"
          ls -la build/crm/ | head -20
          echo "Total files in crm: $(find build/crm -type f | wc -l)"
        else
          echo "ERROR: CRM folder not found in build/"
          exit 1
        fi
    
    - name: Deploy to Production Environment
      if: github.ref == 'refs/heads/main'
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./build/
        server-dir: ./tools/
        protocol: ftp
        port: 21
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/.github/**
          **/.travis.yml
          **/.codecov.yml
          **/codacy.yml
          **/codeception.dist.yml
          **/phpcs.xml
          **/.php_cs.dist
          **/.php_cs.cache
          **/RoboFile.php
          **/crm/build/**
          **/vendor/build/**
          **/travis.php.ini
          **/README.md
          **/LICENSE.txt
          **/.env.dist
          **/.gitattributes
          **/composer.lock
          **/bower_components/**
          **/.sass-cache/**
          **/tests/_output/**
          **/tests/_envs/**
          **/codeception.yml
          **/BrowserStackLocal
          **/browserstack.err
          **/fakeImapResource
          **/include/Imap/ImapTestSettings.txt
          **/themes/SuiteP/css/*.map
          **/themes/SuiteP/css/*/*.map
          **/themes/SuiteP/css/*/color-palette.css
          **/themes/SuiteP/css/*/variables.css

