name: Deploy to Production

on:
  push:
    branches:
      - test
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Setup PHP and Composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, xml, zip, gd, curl, mysqli, pdo_mysql
        tools: composer
    
    - name: Install Composer Dependencies for SuiteCRM
      run: |
        if [ -f "crm/composer.json" ]; then
          echo "Installing Composer dependencies for SuiteCRM..."
          cd crm
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          cd ..
        fi
    
    - name: Build React Apps
      run: |
        # Find all directories with package.json (React apps)
        for dir in */; do
          if [ -f "${dir}package.json" ]; then
            echo "Building React app in ${dir}"
            cd "${dir}"
            npm install
            npm run build
            cd ..
          fi
        done
    
    - name: Prepare build directory
      run: |
        mkdir -p build
        
        echo "Available directories:"
        ls -la
        
        # Copy simple HTML apps (folders without package.json)
        echo "=== Starting to copy directories ==="
        for dir in */; do
          dirname=$(basename "$dir")
          echo "Checking directory: ${dirname}"
          
          # Skip if it's a React app (has package.json) or special folders
          if [ -f "${dir}package.json" ]; then
            echo "  → Skipping ${dirname} (has package.json - React app)"
            continue
          fi
          
          if [ "$dirname" == "node_modules" ] || [ "$dirname" == ".git" ] || [ "$dirname" == "build" ] || [ "$dirname" == ".github" ] || [ "$dirname" == "docs" ] || [ "$dirname" == "examples" ]; then
            echo "  → Skipping ${dirname} (special folder)"
            continue
          fi
          
          echo "  → Copying ${dirname} to build/"
          if cp -r "${dir}" build/; then
            echo "  ✓ Successfully copied ${dirname}"
            echo "  Verifying copy:"
            if [ -d "build/${dirname}" ]; then
              echo "    ✓ build/${dirname} exists"
              file_count=$(find "build/${dirname}" -type f 2>/dev/null | wc -l)
              echo "    ✓ Contains ${file_count} files"
            else
              echo "    ✗ ERROR: build/${dirname} does not exist after copy!"
            fi
          else
            echo "  ✗ ERROR: Failed to copy ${dirname}"
          fi
        done
        
        echo "Build directory contents after copying:"
        ls -la build/
        
        # Configure SuiteCRM .htaccess for subdirectory deployment
        if [ -d "build/crm" ] && [ -f "crm/.htaccess" ]; then
          echo "Configuring .htaccess for SuiteCRM subdirectory"
          # Update RewriteBase - will be set correctly in deployment step
          # Default to test, production step will override if needed
          cp crm/.htaccess build/crm/.htaccess
        fi
        
        # Copy React app build outputs
        for dir in */; do
          dirname=$(basename "$dir")
          if [ -f "${dir}package.json" ]; then
            echo "Processing React app: ${dirname}"
            if [ -d "${dir}build" ]; then
              echo "  Found build directory"
              # Copy the build folder contents to the app folder in build/
              mkdir -p "build/${dirname}"
              
              # Check if build directory has content
              if [ "$(ls -A "${dir}build" 2>/dev/null)" ]; then
                echo "  Copying build contents..."
                # Try multiple copy methods to ensure it works
                if cp -r "${dir}build"/. "build/${dirname}/" 2>/dev/null; then
                  echo "  ✓ Copy method 1 succeeded (using .)"
                elif cp -r "${dir}build"/* "build/${dirname}/" 2>/dev/null; then
                  echo "  ✓ Copy method 2 succeeded (using *)"
                else
                  echo "  ✗ ERROR: All copy methods failed"
                  exit 1
                fi
              else
                echo "  ✗ ERROR: ${dirname}/build directory is empty - build may have failed"
                exit 1
              fi
              
              # Verify copy was successful
              if [ -d "build/${dirname}" ] && [ "$(ls -A "build/${dirname}" 2>/dev/null)" ]; then
                file_count=$(find "build/${dirname}" -type f 2>/dev/null | wc -l)
                echo "  ✓ Successfully copied ${dirname} build (${file_count} files)"
              else
                echo "  ✗ ERROR: Failed to copy ${dirname} build - destination is empty"
                exit 1
              fi
            else
              echo "  ✗ ERROR: ${dirname}/build directory does not exist - build may have failed"
              exit 1
            fi
          fi
        done
        
        # Copy root level HTML/CSS/JS files
        cp -r *.html *.css *.js build/ 2>/dev/null || true
        cp -r public build/ 2>/dev/null || true
    
    - name: Configure .htaccess for Test Environment
      if: github.ref == 'refs/heads/test'
      run: |
        if [ -f "build/crm/.htaccess" ]; then
          echo "Setting RewriteBase for test environment"
          sed -i 's|RewriteBase /tools-test/crm/|RewriteBase /tools-test/crm/|g' build/crm/.htaccess
          sed -i 's|RewriteBase /tools/crm/|RewriteBase /tools-test/crm/|g' build/crm/.htaccess
        fi
    
    - name: Verify build directory
      if: github.ref == 'refs/heads/test'
      run: |
        echo "=== Build Directory Verification ==="
        echo "Checking if build directory exists..."
        if [ ! -d "build" ]; then
          echo "ERROR: Build directory does not exist!"
          exit 1
        fi
        
        echo "Build directory contents:"
        ls -la build/ || echo "Cannot list build directory"
        
        echo "All folders in build/:"
        find build/ -maxdepth 1 -type d | sort
        
        echo "Checking for React apps..."
        for dir in build/*/; do
          if [ -d "$dir" ]; then
            dirname=$(basename "$dir")
            echo "Checking ${dirname}..."
            if [ -f "build/${dirname}/index.html" ] || [ -f "build/${dirname}/static" ]; then
              echo "  ✓ ${dirname} appears to be a valid app (has index.html or static folder)"
              file_count=$(find "build/${dirname}" -type f 2>/dev/null | wc -l)
              echo "  ✓ Contains ${file_count} files"
            else
              echo "  ⚠ ${dirname} might be incomplete (no index.html or static folder)"
            fi
          fi
        done
        
        echo "Checking for CRM folder (if present)..."
        if [ -d "build/crm" ]; then
          echo "✓ CRM folder found in build/"
          echo "CRM folder contents (first 20 items):"
          ls -la build/crm/ | head -20
          echo "Total files in crm: $(find build/crm -type f 2>/dev/null | wc -l)"
        else
          echo "ℹ CRM folder not found (this is OK if not deploying CRM)"
        fi
        
        echo "=== Verification Complete ==="
    
    - name: Pre-FTP Verification
      if: github.ref == 'refs/heads/test'
      run: |
        echo "=== Pre-FTP Verification ==="
        echo "Checking build directory structure..."
        echo "Total items in build/:"
        find build/ -maxdepth 1 -type f -o -type d | wc -l
        
        echo "Listing all top-level items in build/:"
        ls -la build/
        
        echo "Checking for React apps in build/:"
        for app_dir in build/*/; do
          if [ -d "$app_dir" ]; then
            app_name=$(basename "$app_dir")
            echo "  App: ${app_name}"
            if [ -f "${app_dir}index.html" ]; then
              echo "    ✓ Has index.html"
            fi
            if [ -d "${app_dir}static" ]; then
              echo "    ✓ Has static folder"
            fi
            file_count=$(find "$app_dir" -type f 2>/dev/null | wc -l)
            echo "    Total files: ${file_count}"
          fi
        done
        
        echo "=== Pre-FTP Verification Complete ==="
        
        # Ensure build directory is not empty
        if [ -z "$(ls -A build/ 2>/dev/null)" ]; then
          echo "ERROR: Build directory is empty!"
          exit 1
        fi
        
        echo "Build directory is ready for deployment"
    
    - name: Deploy to Test Environment
      if: github.ref == 'refs/heads/test'
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./build/
        server-dir: ./tools-test/
        protocol: ftp
        port: 21
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/.github/**
          **/.travis.yml
          **/.codecov.yml
          **/codacy.yml
          **/codeception.dist.yml
          **/phpcs.xml
          **/.php_cs.dist
          **/.php_cs.cache
          **/RoboFile.php
          **/build/**
          **/travis.php.ini
          **/README.md
          **/LICENSE.txt
          **/.env.dist
          **/.gitattributes
          **/composer.lock
          **/bower_components/**
          **/.sass-cache/**
          **/tests/_output/**
          **/tests/_envs/**
          **/codeception.yml
          **/BrowserStackLocal
          **/browserstack.err
          **/fakeImapResource
          **/include/Imap/ImapTestSettings.txt
          **/themes/SuiteP/css/*.map
          **/themes/SuiteP/css/*/*.map
          **/themes/SuiteP/css/*/color-palette.css
          **/themes/SuiteP/css/*/variables.css
    
    - name: Configure .htaccess for Production Environment
      if: github.ref == 'refs/heads/main'
      run: |
        if [ -f "build/crm/.htaccess" ]; then
          echo "Setting RewriteBase for production environment"
          sed -i 's|RewriteBase /tools-test/crm/|RewriteBase /tools/crm/|g' build/crm/.htaccess
          sed -i 's|RewriteBase /tools/crm/|RewriteBase /tools/crm/|g' build/crm/.htaccess
        fi
    
    - name: Verify build directory
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Checking build directory contents..."
        ls -la build/ || echo "Build directory does not exist"
        if [ -d "build/crm" ]; then
          echo "CRM folder found in build/"
          ls -la build/crm/ | head -20
          echo "Total files in crm: $(find build/crm -type f | wc -l)"
        else
          echo "ERROR: CRM folder not found in build/"
          exit 1
        fi
    
    - name: Deploy to Production Environment
      if: github.ref == 'refs/heads/main'
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./build/
        server-dir: ./tools/
        protocol: ftp
        port: 21
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/.github/**
          **/.travis.yml
          **/.codecov.yml
          **/codacy.yml
          **/codeception.dist.yml
          **/phpcs.xml
          **/.php_cs.dist
          **/.php_cs.cache
          **/RoboFile.php
          **/build/**
          **/travis.php.ini
          **/README.md
          **/LICENSE.txt
          **/.env.dist
          **/.gitattributes
          **/composer.lock
          **/bower_components/**
          **/.sass-cache/**
          **/tests/_output/**
          **/tests/_envs/**
          **/codeception.yml
          **/BrowserStackLocal
          **/browserstack.err
          **/fakeImapResource
          **/include/Imap/ImapTestSettings.txt
          **/themes/SuiteP/css/*.map
          **/themes/SuiteP/css/*/*.map
          **/themes/SuiteP/css/*/color-palette.css
          **/themes/SuiteP/css/*/variables.css

